<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hair Care Tips - Ruis Hair</title>
  <meta name="description" content="Expert tips on caring for, styling and storing your virgin Remy hair extensions — from washing to coloring to heat styling.">
  <link rel="canonical" href="https://ruishairfactory.com/tips.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hair Care Tips - Ruis Hair">
  <meta property="og:description" content="Expert tips on caring for, styling and storing your virgin Remy hair extensions.">
  <meta property="og:url" content="https://ruishairfactory.com/tips.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="tips">

  <!-- 列表页 hero -->
  <div class="page-hero"><div class="wrap">
    <div class="crumb"><a href="index.html">Home</a><span>/</span><span id="tipsCrumb">Tips</span></div>
    <h1 id="tipsTitle">Hair Care Tips</h1>
    <p class="muted" id="tipsSub">Expert advice to help your clients love and care for their Remy hair extensions.</p>
  </div></div>

  <!-- 文章列表视图 -->
  <section class="section" id="tipsListView">
    <div class="wrap">
      <div class="tips-grid" id="tipsGrid"></div>
      <div id="tipsEmpty" style="display:none;text-align:center;padding:60px 20px;color:var(--muted)">No articles yet.</div>
    </div>
  </section>

  <!-- 文章详情视图 -->
  <section class="section" id="tipsDetailView" style="display:none">
    <div class="wrap" style="max-width:820px">
      <a class="link-all" href="tips.html" style="margin-bottom:20px;display:inline-block">← Back to all tips</a>
      <article class="tip-article">
        <img class="tip-hero-img" id="tipImg" src="" alt="">
        <div class="tip-meta">
          <span class="tag" id="tipCategory"></span>
          <span class="muted" id="tipDate"></span>
          <span class="muted" id="tipAuthor"></span>
        </div>
        <h1 class="tip-title" id="tipTitle"></h1>
        <div class="tip-body" id="tipBody"></div>
      </article>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cloud-config.js"></script>
  <script src="assets/js/cloud-data.js"></script>
  <script src="assets/js/cloud-sync.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const tips = loadTips();
    const params = new URLSearchParams(location.search);
    const tipId = params.get('id');

    function renderList() {
      document.getElementById('tipsListView').style.display = 'block';
      document.getElementById('tipsDetailView').style.display = 'none';
      const grid = document.getElementById('tipsGrid');
      if (!tips.length) {
        document.getElementById('tipsEmpty').style.display = 'block';
        grid.innerHTML = '';
        return;
      }
      document.getElementById('tipsEmpty').style.display = 'none';
      grid.innerHTML = tips.map(t => `
        <a class="tip-card" href="tips.html?id=${t.id}">
          <div class="tip-card-img"><img src="${t.image}" alt="${t.title}" loading="lazy"></div>
          <div class="tip-card-body">
            <div class="tip-card-meta"><span class="tag">${t.category || 'Tips'}</span><span class="muted">${t.date || ''}</span></div>
            <h3>${t.title}</h3>
            <p>${t.excerpt || ''}</p>
            <span class="read-more">Read more →</span>
          </div>
        </a>`).join('');
    }

    function renderDetail() {
      const t = tips.find(x => x.id === tipId);
      if (!t) { renderList(); return; }
      document.getElementById('tipsListView').style.display = 'none';
      document.getElementById('tipsDetailView').style.display = 'block';
      document.title = t.title + ' - Ruis Hair';
      document.getElementById('tipImg').src = t.image;
      document.getElementById('tipCategory').textContent = t.category || 'Tips';
      document.getElementById('tipDate').textContent = t.date || '';
      document.getElementById('tipAuthor').textContent = t.author ? 'By ' + t.author : '';
      document.getElementById('tipTitle').textContent = t.title;
      // 正文按换行分段
      document.getElementById('tipBody').innerHTML = (t.body || '').split('\n').map(p => p.trim()).filter(Boolean).map(p => {
        // 支持简单的 bullet 行
        if (/^•/.test(p) || /^\d+\./.test(p) || /^-/.test(p)) {
          return '<p class="tip-li">' + p + '</p>';
        }
        return '<p>' + p + '</p>';
      }).join('');
      window.scrollTo(0, 0);
    }

    if (tipId) renderDetail(); else renderList();
  </script>
</body>
</html>
